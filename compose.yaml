services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: products
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - products-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d products"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  products-data:
